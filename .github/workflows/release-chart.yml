name: Release chart

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "artifacthub-repo.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: azure/setup-helm@v5

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish artifacthub-repo.yml to gh-pages
        # Artifact Hub fetches this file from the served repo root (gh-pages),
        # not from main, to verify/claim ownership of the Helm repo itself.
        # main is the source of truth; this just mirrors it over.
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cp artifacthub-repo.yml /tmp/gh-pages/artifacthub-repo.yml
          if ! git -C /tmp/gh-pages diff --quiet -- artifacthub-repo.yml; then
            git -C /tmp/gh-pages add artifacthub-repo.yml
            git -C /tmp/gh-pages commit -m "chore: sync artifacthub-repo.yml"
            git -C /tmp/gh-pages push origin HEAD:gh-pages
          fi
          git worktree remove /tmp/gh-pages --force
